name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Conventional Commits, enforced on every commit in the PR (see
  # CONTRIBUTING.md and commitlint.config.js).
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # Frontend: lint, format check, type-check, build. Platform-independent —
  # no native module compiles here, so the cheaper/faster ubuntu runner is
  # fine even though the app itself only ships on Windows.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # Backend: fmt check, clippy, tests. MUST run on Windows — the crate links
  # WASAPI/Win32 COM (windows-rs) and does not build on Linux/macOS.
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Avis de sécurité des dépendances, des DEUX côtés. Le côté Rust n'était
  # pas couvert alors que c'est là que vit le code sensible (WASAPI, COM,
  # interface AudioPolicyConfig non documentée).
  #
  # Tourne sur ubuntu bien que le crate soit Windows-only : `cargo audit` ne
  # fait que lire Cargo.lock et le comparer à la base RustSec, il ne compile
  # rien — pas besoin du runner Windows, plus lent et plus cher.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Seuil `high` : les avis low/moderate d'un outil de build ne doivent
      # pas bloquer une PR à eux seuls. `npm audit` travaille depuis le
      # lockfile, aucune installation n'est nécessaire.
      - run: npm audit --audit-level=high
      # Binaire préconstruit : `cargo install cargo-audit` recompilerait
      # tout à chaque exécution (plusieurs minutes).
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
        working-directory: src-tauri
