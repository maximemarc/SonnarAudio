[package]
name = "mixflow"
version = "0.1.0"
description = "Virtual audio routing & mixing desktop app (SteelSeries Sonar-like)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: system-tray support (Discord-like minimize-to-tray).
tauri = { version = "2", features = ["tray-icon"] }
# "Démarrer avec Windows" — registers/unregisters the app in the current
# user's Run key, no admin rights needed.
tauri-plugin-autostart = "2"
# Native save/open dialogs — export/import config.
tauri-plugin-dialog = "2"
# System-wide hotkey (mic mute toggle) even when the window is hidden in the tray.
tauri-plugin-global-shortcut = "2"
# Mise à jour auto : vérifie `latest.json` publié par release.yml et valide
# la signature minisign contre la pubkey de tauri.conf.json.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encodes extracted app icons as data-URIs for the frontend.
base64 = "0.22"
# Cross-platform audio I/O — uses WASAPI on Windows (shared mode).
cpal = "0.15"
# Lock-free SPSC ring buffers between capture threads and render threads.
ringbuf = "0.4"
# Non-poisoning mutexes for app state.
parking_lot = "0.12"
# Raw Windows APIs: audio-session enumeration (which apps are playing sound)
# and per-app output-device routing (the drag-and-drop feature).
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_WinRT",
  "Win32_Foundation",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
